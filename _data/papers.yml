- title: "Excluded by design: the effects of limiting neighbourhood access on incumbent residents"
  coauthors: "with Anne Gielen, Elisabeth Leduc and Olivier Marie"
  status: "Work in progress"
  year: 2026
  on_request: true
  slides: "/files/papers/excluded-by-design-slides.pdf"
  abstract: >-
    Neighbourhoods shape economic and life outcomes. Existing research relies on
    selective residential moves to identify neighbourhood effects. We study these
    effects using a plausibly exogenous change in composition induced by the
    Rotterdam Wet, a policy barring workless individuals with less than six years
    of residency in the region from moving into selected disadvantaged
    neighbourhoods. The policy also displaced targeted areas' residents meeting
    the work and tenure criteria at lease renewal. In targeted neighbourhoods,
    the policy led to a persistent increase in the share of employed residents
    and a decrease in welfare recipiency and criminal involvement, driven by
    changes in the type of entrants. We observe a behavioural response among
    incumbent residents, who increase their employment and decrease their welfare
    participation and criminal behaviour. Exploiting the sharp discontinuity in
    policy applicability at the six-year residency threshold, we show that
    incumbent residents react to the displacement threat by exiting welfare and
    informal work to take up formal employment. Future analyses exploiting
    street-level data will establish the role of local peer composition on labour
    outcomes and criminal offences.

- title: "They took our crimes: resolving the immigration-crime puzzle"
  coauthors: "with Olivier Marie and Paolo Pinotti"
  status: "Work in progress"
  year: 2026
  # Drop the draft at files/papers/took-our-crimes-paper.pdf, then swap the two
  # lines below (delete `on_request` and uncomment `paper`).
  on_request: true
  # paper: "/files/papers/took-our-crimes-paper.pdf"
  slides: "/files/papers/took-our-crimes-slides.pdf"
  abstract: >-
    Immigration is known not to causally affect crime. Despite this, individuals
    with a migration background are highly overrepresented in prisons. We propose
    a framework reconciling these two facts. Causal estimates of immigration on
    crime mask heterogeneity in the effects. Leveraging detailed administrative
    data and two distinct research designs, we show that immigration leads to a
    substitution between natives and immigrants in local crime markets whereas
    the overall criminal activity is unchanged. We are able to rule out
    discrimination as an alternative mechanism.

