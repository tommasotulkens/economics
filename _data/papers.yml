- title: "Peer effects in voting: historical evidence from extending the franchise"
  coauthors: "with Auke Rijpma"
  status: "Work in progress"
  year: 2026
  abstract: >-
    Does extending the right to vote change the economic position of those who
    gain it? We study the Dutch franchise extensions of 1850, 1887 and 1896,
    which raised the share of enfranchised men from roughly ten to close to fifty
    per cent. Eligibility was tied to tax thresholds that varied across
    municipalities, which lets us compare households just above and just below
    the local cut-off in a stacked fuzzy regression discontinuity design. We
    combine a digitised historical income panel of Dutch households covering
    1860 to 1920 with electoral registers recording exactly who obtained the
    right to vote. We use this setting to ask whether enfranchisement raised the
    incomes of new voters and of their neighbours, and to examine the mechanisms
    at work: the socio-economic composition of elected officials, municipal
    spending on public goods, and the bargaining position of newly represented
    occupations.
