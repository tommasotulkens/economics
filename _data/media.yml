- title: "Franchise chez Delhaize : que nous enseignent les expériences à l'étranger ?"
  url: "https://www.lecho.be/opinions/general/franchise-chez-delhaize-que-nous-enseignent-les-experiences-a-l-etranger/10483973.html"
  outlet: "L'Echo"
  year: 2023
  language: "In French"
  description: >-
