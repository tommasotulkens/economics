---
layout: default
---
<div class="shell">
  <header class="page-head" data-reveal>
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
    <h1 class="page-head__title">{{ page.heading | default: page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif -%}
  </header>

  <div class="page-body" data-reveal>
    {{ content }}
  </div>
</div>
